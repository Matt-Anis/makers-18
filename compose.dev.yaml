services:
  backend:
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    volumes:
      - ./backend/app:/app/app:ro
      - backend_data:/data

  frontend:
    command: ["./node_modules/.bin/next", "dev", "--hostname", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
