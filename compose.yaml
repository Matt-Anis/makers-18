services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////data/gateway.db
      REDIS_URL: redis://redis:6379/0
      AUTH_COOKIE_SECURE: "false"
      SEED_DEMO_USERS: "true"
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-ZGV2LW9ubHktMzItYnl0ZS1mZXJuZXQta2V5LTAwMDA=}
    volumes:
      - backend_data:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
    depends_on:
      - backend

volumes:
  backend_data:
