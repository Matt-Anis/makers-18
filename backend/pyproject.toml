[project]
name = "nyxora-backend"
version = "0.1.0"
description = "NYXORA Contract Privacy Gateway FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "redis>=5.0,<6.0",
    "cryptography>=42.0",
    "httpx>=0.27,<1.0",
    "presidio-analyzer>=2.2.354,<3.0",
    "spacy>=3.7,<4.0",
    "pypdf>=5.0,<6.0",
    "python-multipart>=0.0.20,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]
